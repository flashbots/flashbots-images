# Reusable GitHub Actions workflow for building and publishing mkosi images.
#
# Builds the specified image, uploads the artifacts to R2, and creates a draft
# GitHub Release when the build is driven by a release tag.
#
# Behavior:
# - Release tag (<image-id>-vX.Y.Z, pushed or passed as `ref`):
#   - Builds the image at that tag
#   - Uploads artifacts to R2 under <r2-path-prefix>/vX.Y.Z/
#   - Creates a draft GitHub Release with measurements and changelog
#
# - Any other ref (branch, SHA, or empty):
#   - Builds a dev image at that ref
#   - Uploads artifacts to R2 under <r2-path-prefix>/dev/<branch>.<sha>/
#   - No release is created

name: Build and publish image (generic)

on:
  workflow_call:
    inputs:
      image-id:
        description: "Image to build. Drives mkosi --image-id / images/<id>.conf, the tag prefix (<image-id>-v*), the default R2 prefix (<image-id>-images), and the artifact globs."
        type: string
        required: true
      ref:
        description: "Tag, SHA, or branch to build. An existing `<image-id>-vX.Y.Z[-suffix]` release tag selects release mode; anything else is a dev build at that ref. Empty = the triggering ref."
        type: string
        default: ""
      dev-image:
        description: "Build a dev image (devtools profile) via `make build-dev`. Produces <image-id>-dev_* artifacts."
        type: boolean
        default: false
      r2-bucket:
        description: "R2 bucket to upload artifacts to"
        type: string
        default: "flashbots-public-artifacts"
      r2-path-prefix:
        # Input defaults cannot reference other inputs, so the fallback is
        # applied at runtime.
        description: "R2 destination prefix (default: <image-id>-images)"
        type: string
        default: ""
      draft:
        description: "Create the GitHub Release as a draft"
        type: boolean
        default: true

permissions:
  contents: write # required for `gh release create`

jobs:
  build:
    name: Build ${{ inputs.image-id }}
    runs-on: warp-ubuntu-latest-x64-32x
    env:
      R2_PUBLIC_BASE_URL: "https://builder-artifacts.flashbots.net"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # full history + tags for the per-prefix changelog window

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # env_wrapper.sh uses Lima by default for local builds; in CI we already
      # have Linux + nix, so bypass Lima and run mkosi directly.
      - name: Bypass Lima wrapper
        run: touch .bypass-lima

      - name: Enable user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # STEM is the artifact filename stem; build-dev appends -dev to the image id.
      - name: Derive names
        env:
          IMAGE: ${{ inputs.image-id }}
          R2_PATH_PREFIX_INPUT: ${{ inputs.r2-path-prefix }}
          DEV_IMAGE: ${{ inputs.dev-image }}
        run: |
          set -euo pipefail
          if [[ "${DEV_IMAGE}" == "true" ]]; then STEM="${IMAGE}-dev"; else STEM="${IMAGE}"; fi
          {
            echo "IMAGE=${IMAGE}"
            echo "STEM=${STEM}"
            echo "TAG_PREFIX=${IMAGE}"
            echo "R2_PATH_PREFIX=${R2_PATH_PREFIX_INPUT:-${IMAGE}-images}"
          } >> "$GITHUB_ENV"

      # Sets release_tag when the build is driven by a <image-id>-vX.Y.Z tag,
      # either pushed or passed as `ref`; empty otherwise.
      - name: Resolve release tag
        id: resolve-tag
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          TAG_RE="^${TAG_PREFIX}-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?\$"
          RELEASE_TAG=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq "${TAG_RE}"; then
              echo "::error::pushed tag '${GITHUB_REF_NAME}' doesn't match ${TAG_PREFIX}-vX.Y.Z[-suffix]"
              exit 1
            fi
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${REF_INPUT}" ]] && printf '%s' "${REF_INPUT}" | grep -Eq "${TAG_RE}"; then
            if ! git rev-parse -q --verify "refs/tags/${REF_INPUT}" >/dev/null; then
              echo "::error::'${REF_INPUT}' matches the release tag format but no such tag exists"
              exit 1
            fi
            RELEASE_TAG="${REF_INPUT}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Reject dev-image release
        if: ${{ steps.resolve-tag.outputs.release_tag != '' && inputs.dev-image }}
        run: |
          echo "::error::dev-image builds cannot be released (tag ${{ steps.resolve-tag.outputs.release_tag }})"
          exit 1

      - name: Compute version (release)
        if: ${{ steps.resolve-tag.outputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          {
            echo "RELEASE=true"
            echo "VERSION_DIR=v${RELEASE_TAG#"${TAG_PREFIX}"-v}"
            echo "IMAGE_VERSION="
          } >> "$GITHUB_ENV"

      - name: Compute version (dev)
        if: ${{ steps.resolve-tag.outputs.release_tag == '' }}
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Lowercase to [a-z0-9-] so the GCS image name and R2 path stay valid.
          # GITHUB_SHA differs from the checked-out HEAD when a custom ref is passed.
          HEAD_SHA="$(git rev-parse HEAD)"
          SRC_REF="${REF_INPUT:-${GITHUB_REF_NAME}}"
          BRANCH="$(printf '%s' "${SRC_REF}" \
            | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' \
            | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          # env_wrapper.sh's latest.* symlink handling requires a version
          # containing a dot.
          DEV_VERSION="${BRANCH}.${HEAD_SHA:0:8}"
          {
            echo "RELEASE=false"
            echo "VERSION_DIR=dev/${DEV_VERSION}"
            echo "IMAGE_VERSION=${DEV_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Show mode
        run: |
          echo "mode: RELEASE=${RELEASE}, STEM=${STEM}, R2_PATH_PREFIX=${R2_PATH_PREFIX}, VERSION_DIR=${VERSION_DIR}, IMAGE_VERSION=${IMAGE_VERSION:-<default>}"

      # MKOSI_EXTRA_ARGS is picked up and appended to mkosi by env_wrapper.sh.
      - name: Build image
        env:
          DEV_IMAGE: ${{ inputs.dev-image }}
        run: |
          set -euo pipefail
          umask 022
          EXTRA=""
          if [[ -n "${IMAGE_VERSION}" ]]; then
            EXTRA="--image-version=${IMAGE_VERSION}"
          fi
          export MKOSI_EXTRA_ARGS="${EXTRA}"
          if [[ "${DEV_IMAGE}" == "true" ]]; then
            make build-dev IMAGE="${IMAGE}"
          else
            make build IMAGE="${IMAGE}"
          fi

      - name: Fix permissions
        run: sudo chown -R "$(id -u):$(id -g)" build/

      - name: Export measurements (GCP TDX)
        run: |
          set -euo pipefail
          make measure-gcp

      - name: Show build artifacts
        run: ls -lh build/

      - name: Install rclone
        run: |
          set -euo pipefail
          RCLONE_DEB=rclone-v1.74.2-linux-amd64.deb
          curl -fsSL -o "${RCLONE_DEB}" "https://downloads.rclone.org/v1.74.2/${RCLONE_DEB}"
          echo "d2232f57e47ff4f9b30f1b575ce95567b1c51f22526c4e98814641dfd835c103  ${RCLONE_DEB}" | sha256sum -c -
          sudo apt-get install -y "./${RCLONE_DEB}"
          rm -f "${RCLONE_DEB}"

      - name: Configure rclone (R2 artifacts)
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_FLASHBOTS_PUBLIC_ARTIFACTS_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_FLASHBOTS_PUBLIC_ARTIFACTS_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_FLASHBOTS_PUBLIC_ARTIFACTS_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          # use_data_integrity_protections=false: R2 returns 501 NotImplemented
          # for the CRC32 checksum trailers aws-sdk-go-v2 sends by default.
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2-flashbots-public-artifacts]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          region = auto
          endpoint = ${R2_ENDPOINT}
          acl = private
          use_data_integrity_protections = false
          EOF

      - name: Upload artifacts to R2
        env:
          R2_BUCKET: ${{ inputs.r2-bucket }}
        run: |
          set -euo pipefail
          # Upload only the image artifacts and measurements.
          rclone copy -P --retries 3 --retries-sleep 20s --error-on-no-transfer \
            --s3-upload-concurrency=8 --transfers=8 \
            --include "${STEM}_*.{efi,tar.gz,qcow2}" \
            --include "gcp_measurements.json" \
            build "r2-flashbots-public-artifacts:${R2_BUCKET}/${R2_PATH_PREFIX}/${VERSION_DIR}/"

      - name: Terraform image entry (R2 source_uri)
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ -z "${R2_PUBLIC_BASE_URL}" ]]; then
            echo "R2_PUBLIC_BASE_URL not set, skipping terraform snippet"
            exit 0
          fi
          for f in build/"${STEM}"_*.tar.gz; do
            n="$(basename "$f")"
            # GCP image name charset: sanitize _ and . to - for the map key.
            key="${n%.tar.gz}"; key="${key//[_.]/-}"
            uri="${R2_PUBLIC_BASE_URL}/${R2_PATH_PREFIX}/${VERSION_DIR}/${n}"
            {
              echo "### 📋 Terraform image entry"
              echo ""
              echo "Add to the GCP confidential-VM \`images\` map (the module fetches the URL → GCS → image):"
              echo ""
              echo '```hcl'
              echo "    \"${key}\" = {"
              echo "      source_uri = \"${uri}\""
              echo "    }"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Create draft GitHub Release
        if: ${{ env.RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          R2_BUCKET: ${{ inputs.r2-bucket }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          # Most recent previous release tag for this image, reachable from HEAD,
          # used as the changelog starting point.
          PREV="$(git tag --list "${TAG_PREFIX}-v*" --merged HEAD --sort=-v:refname \
            | grep -vxF "${RELEASE_TAG}" | head -n1 || true)"
          echo "Previous tag for changelog: '${PREV:-<none>}'"

          shopt -s nullglob
          # On a dispatched rebuild GITHUB_SHA points at the branch the workflow
          # ran from, so use the checked-out HEAD.
          HEAD_SHA="$(git rev-parse HEAD)"
          COMMIT_SHORT="${HEAD_SHA:0:7}"
          BUILT="$(date -u '+%Y-%m-%d %H:%M UTC')"
          VERSION="${RELEASE_TAG#"${TAG_PREFIX}"-v}"
          {
            echo "## 🚀 \`${IMAGE}\`: ${RELEASE_TAG}"
            echo ""
            echo "| | |"
            echo "|--:|:--|"
            echo "| 📦 **Image** | \`${IMAGE}\` |"
            echo "| 🏷️ **Version** | \`${VERSION}\` |"
            echo "| 🔖 **Commit** | [\`${COMMIT_SHORT}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${HEAD_SHA}) |"
            echo "| 📅 **Built** | ${BUILT} |"
            echo ""
            echo "### 💿 Images"
            echo ""
            if [[ -n "${R2_PUBLIC_BASE_URL}" ]]; then
              echo "| Target | File | Size |"
              echo "|---|---|--:|"
              for f in build/"${STEM}"_*.efi build/"${STEM}"_*.tar.gz build/"${STEM}"_*.qcow2; do
                n="$(basename "$f")"
                sz="$(du -h "$f" | cut -f1)"
                case "$n" in
                  *.efi)    t="🐧 UKI (EFI)" ;;
                  *.tar.gz) t="☁️ GCP disk" ;;
                  *.qcow2)  t="🧪 QEMU qcow2" ;;
                  *)        t="📄 artifact" ;;
                esac
                echo "| ${t} | [\`${n}\`](${R2_PUBLIC_BASE_URL}/${R2_PATH_PREFIX}/${VERSION_DIR}/${n}) | ${sz} |"
              done
            else
              echo "> [!TIP]"
              echo "> Images live in the \`${R2_BUCKET}\` R2 bucket under \`${R2_PATH_PREFIX}/${VERSION_DIR}/\`."
            fi
            echo ""
            echo "> [!NOTE]"
            echo "> **\`gcp_measurements.json\`** (attached, also on R2): the expected TDX measurements (MRTD, RTMR0-3) for this image on GCP, from [\`dstack-mr-gcp\`](https://github.com/flashbots/dstack-mr-gcp). Reproduce them yourself with the steps below."
            echo ">"
            echo "> 📖 Details: [attestation walkthrough](https://github.com/flashbots/flashbots-images/blob/main/modules/flashbox/flashbox-l1/readme.md#attestation-walkthrough) · [cvm-reverse-proxy](https://github.com/flashbots/cvm-reverse-proxy)"
            echo ""
            echo "### 🔁 Reproduce the measurements"
            echo ""
            echo "1. Clone and check out this release:"
            echo '   ```bash'
            echo "   git clone ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} && cd ${GITHUB_REPOSITORY#*/}"
            echo "   git checkout ${RELEASE_TAG}"
            echo '   ```'
            echo "2. Build the image (~30 min):"
            echo '   ```bash'
            echo "   make build IMAGE=${IMAGE}"
            echo '   ```'
            echo "3. Reproduce the measurements:"
            echo '   ```bash'
            echo "   make measure-gcp"
            echo '   ```'
            echo "   Your \`build/gcp_measurements.json\` should be identical to the attached one."
            echo ""
            echo "### 🔐 Attest your running VM"
            echo ""
            echo "To verify your running VM, generate an Intel-signed TDX quote and validate it against expected measurements using [\`cvm-reverse-proxy\`](https://github.com/flashbots/cvm-reverse-proxy) over attested TLS."
            echo ""
            echo "1. Set your instance IP and build the client:"
            echo '   ```bash'
            echo "   VM_IP=<your-instance-ip>"
            echo "   git clone https://github.com/flashbots/cvm-reverse-proxy && make -C cvm-reverse-proxy build-proxy-client"
            echo '   ```'
            echo "2. Convert your measurements to the proxy's format (temporary [jq shim](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/scripts/gcp_measurements_to_dcap.sh)):"
            echo '   ```bash'
            echo "   scripts/gcp_measurements_to_dcap.sh > gcp-server-measurements.json"
            echo '   ```'
            echo "3. Attest:"
            echo '   ```bash'
            echo "   cvm-reverse-proxy/build/proxy-client --server-measurements gcp-server-measurements.json --target-addr=https://\${VM_IP}:8745 &"
            echo "   curl -si http://127.0.0.1:8080 | grep -q X-Flashbots-Measurement && echo '✅ VM matches YOUR build' || echo '❌ mismatch'"
            echo '   ```'
            echo ""
            echo "---"
            echo ""
          } > release-body.md

          # Changelog via GitHub's native auto-notes engine (honors .github/release.yml),
          # scoped to the previous matching tag.
          GEN_ARGS=(-f "tag_name=${RELEASE_TAG}")
          if [[ -n "${PREV}" ]]; then
            GEN_ARGS+=(-f "previous_tag_name=${PREV}")
          fi
          NOTES="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${GEN_ARGS[@]}" --jq .body)"
          {
            cat release-body.md
            echo "${NOTES}"
          } > release-notes.md

          # Attach the measurements and the .efi UKI; the larger tar.gz/qcow2
          # artifacts stay in R2 and are linked in the release body.
          assets=()
          for f in build/gcp_measurements.json build/"${STEM}"_*.efi; do
            [ -e "$f" ] && assets+=("$f")
          done

          create_args=(--title "${RELEASE_TAG}" --notes-file release-notes.md)
          if [[ "${DRAFT}" == "true" ]]; then
            create_args+=(--draft)
          fi
          gh release create "${RELEASE_TAG}" "${create_args[@]}" "${assets[@]}"
