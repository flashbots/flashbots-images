# Runtime directories for egress-resolver (see egress-resolver.service).
# /run/egress-resolver/resolve is written by the unprivileged resolve step;
# everything else by the root apply step, which holds only CAP_NET_ADMIN.
d /run/egress-resolver            0755 root            root            -
d /run/egress-resolver/resolve    0755 egress-resolver egress-resolver -
d /run/egress-resolver/metrics    0755 root            root            -
# Bind-mounted read-only into the searcher container; /etc/hosts links here.
d /run/flashbox-endpoints         0755 root            root            -
f /run/flashbox-endpoints/hosts   0644 root            root            - 127.0.0.1 localhost\n
# Shared with toggle; must exist so the sandboxed service can bind-mount it.
f /etc/searcher-network.lock      0644 root            root            -
# iptables -w lock file; same reason.
f /run/xtables.lock               0600 root            root            -
