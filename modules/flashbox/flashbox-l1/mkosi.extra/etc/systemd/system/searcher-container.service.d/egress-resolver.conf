[Unit]
# The container's /etc/hosts is a symlink into /run/flashbox-endpoints, which
# egress-resolver-apply populates. Wants= rather than Requires=: the apply
# unit's exit status is not the readiness signal (a run with DNS unreachable
# succeeds with empty chains); the wait step below is.
Wants=egress-resolver-apply.service
After=egress-resolver-apply.service

[Service]
# Do not start the container until every BuilderNet name has an authenticated
# answer this boot and the firewall holds the resulting maintenance blocklist,
# so maintenance mode never runs against an empty or partial blocklist. No
# timeout (oneshot default): during a DNS-over-TLS outage at boot the container
# waits, and production would be refused by toggle in that state anyway.
ExecStartPre=/usr/bin/egress-resolver-wait-ready
