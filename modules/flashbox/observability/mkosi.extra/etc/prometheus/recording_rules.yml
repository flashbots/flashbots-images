groups:
  # Base metrics — local: prefix means they stay inside the TEE
  # (remote_write only forwards flashbox:*)
  - name: local_container_metrics
    interval: 30s
    rules:
      # Percent of total machine CPU capacity (normalized by core count, so the
      # 0-100 scale holds regardless of how many vCPUs the VM has).
      - record: local:container_cpu_percent
        expr: >
          sum(rate(namedprocess_namegroup_cpu_seconds_total{groupname="searcher-container"}[5m])) * 100
          / count(node_cpu_seconds_total{mode="idle"})

  # Forwarded metrics — flashbox: prefix, picked up by remote_write
  - name: flashbox_health
    interval: 30s
    rules:
      # 1 if at least one process is running in the searcher-container group,
      # absent if process-exporter isn't reporting it.
      - record: flashbox:container_alive
        expr: namedprocess_namegroup_num_procs{groupname="searcher-container"} > bool 0

      # Spike-guarded: current 15m avg must be under 80%,
      # AND the 10m max ending 5m ago must have been under 70%
      - record: flashbox:container_average_cpu_is_under_80_percent
        expr: >
          (avg_over_time(local:container_cpu_percent[15m]) < bool 80)
          * (max_over_time(local:container_cpu_percent[10m] offset 5m) < bool 70)

      - record: flashbox:container_oom_kills_count
        expr: node_vmstat_oom_kill

      - record: flashbox:disk_free_space_is_over_10_percent
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > bool 0.1

      - record: flashbox:disk_free_space_is_over_128_gb
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/persistent"}) > bool (128 * 1024 * 1024 * 1024)

      - record: flashbox:network_is_up
        expr: >
          (sum(rate(node_network_receive_bytes_total{device!~"lo"}[5m]))
          + sum(rate(node_network_transmit_bytes_total{device!~"lo"}[5m])))
          > bool 0

      # egress-resolver (runtime BuilderNet endpoint resolution, exported via
      # the node-exporter textfile collector). node-exporter labels the mtime
      # series with the full path of the file. A missing or unparseable file
      # yields 0 rather than an absent series.
      - record: flashbox:egress_resolver_is_running
        expr: >
          ((time() - node_textfile_mtime_seconds{file=~".*/egress-resolver\\.prom"}) < bool 300)
          or vector(0)

      # The last run installed the planned policy in the firewall and the hosts
      # file, every required endpoint has an address, and the connection sweep
      # succeeded. Any 0 here means the searcher can be blocked from production
      # or a flow may have survived a policy change.
      - record: flashbox:egress_resolver_apply_ok
        expr: egress_resolver_apply_ok or vector(0)

      - record: flashbox:egress_resolver_hosts_ok
        expr: egress_resolver_hosts_ok or vector(0)

      - record: flashbox:egress_resolver_conntrack_ok
        expr: egress_resolver_conntrack_ok or vector(0)

      - record: flashbox:egress_resolver_required_endpoints_resolved
        expr: egress_resolver_required_satisfied or vector(0)

      # Distinguishes "updater is running" from "DNS answers are current":
      # 0 for a prolonged DNS/DoT outage while last-known-good addresses are
      # still in use.
      - record: flashbox:egress_resolver_required_endpoints_fresh
        expr: egress_resolver_required_fresh or vector(0)

      - record: flashbox:egress_resolver_production_addresses
        expr: egress_resolver_production_addresses or vector(0)

      # An authenticated NXDOMAIN/NODATA removes a region in one tick; correct,
      # but somebody should know.
      - record: flashbox:egress_resolver_endpoint_has_addresses
        expr: egress_resolver_endpoint_addresses > bool 0
