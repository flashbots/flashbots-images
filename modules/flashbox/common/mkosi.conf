[Build]
Environment=KERNEL_CONFIG_SNIPPETS_FLASHBOX=modules/flashbox/common/kernel/config.d
WithNetwork=true

[Content]
ExtraTrees=modules/flashbox/common/mkosi.extra
PostInstallationScripts=modules/flashbox/common/unmask-systemd.sh
                        modules/flashbox/common/mkosi.postinst
BuildScripts=modules/flashbox/common/mkosi.build
# Appended to shared/mkosi.conf's cmdline (TDX guest tuning, no change to the security settings):
# - cpuidle_haltpoll.force=1: poll briefly before idling. Every idle halt in a TD exits through the TDX
#   module, and kvm-hint-dedicated never reaches TDs. Measured on bare metal: cross-vCPU wake-ups 6x faster,
#   4k disk QD128 71k -> 175k IOPS, exits -68..-97%.
#
# Deliberately left out: accept_memory=eager (accept all guest memory at boot instead of on first touch).
# The default (lazy) accepts each page once, the first time the guest allocates it; after that, memory is as
# fast as with eager. Measured on bare metal (TDX, 24 vCPUs):
#   pro: first touch of a page ~7x faster (21.7 vs 3 GiB/s with 24 threads; one thread: ~2.8 s/GiB lazy),
#        so no acceptance stalls when a workload first grows into memory
#   con: boot to SSH +28 s at 176G (59.5 vs 31.8 s); within noise at 32G (23.3 s)
#   con: every TD reboot/restart tears down all accepted memory, ~2.1 s per GiB (176G: ~6 min, 32G: ~1 min);
#        with lazy, the teardown only covers what the guest has used so far
# Consider it only for large-memory deployments whose workload must not stall on first touch.
KernelCommandLine=cpuidle_haltpoll.force=1

VolatilePackages=attested-tls-proxy

Packages=podman
         catatonit
         runc
         dropbear
         socat
         iptables
         iproute2
         conntrack
         netfilter-persistent
         curl
         jq
         logrotate
         sudo
         uidmap
         passt
         fuse-overlayfs
         libdevmapper1.02.1
         libjson-c5
         openssh-sftp-server
         libsnappy1v5

BuildPackages=build-essential
              git
              gcc
              golang-go/trixie-backports
              golang-src/trixie-backports
              cargo/trixie-backports
              rustc/trixie-backports
              autoconf
              automake
              libtool
              libssh-dev
              libdevmapper-dev
              libpopt-dev
              uuid-dev
              libblkid-dev
              libjson-c-dev
              gettext
              autopoint
