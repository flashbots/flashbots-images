# Busy polling: a socket read or poll that finds no data polls the NIC queue for up to 50 us before it sleeps.
# In a TDX guest every interrupt and wake-up exits through the TDX module, so polling cuts round trips:
# measured on bare metal (TDX, virtio-net, vhost-net), TCP RTT -8..-16%, through rootless podman's pasta
# UDP RTT -29% and TCP p99.9 under load 389 -> 64 us. The cost is CPU spent spinning while traffic flows.
# Guest-internal scheduling only: no new interface, no effect on isolation.
net.core.busy_read = 50
net.core.busy_poll = 50
