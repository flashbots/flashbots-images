net.ipv4.tcp_congestion_control = cubic
# Allow unprivileged applications to select either algorithm per socket.
net.ipv4.tcp_allowed_congestion_control = cubic bbr
net.ipv4.tcp_slow_start_after_idle = 0
# BDP = Link Speed (10 Gbps) * RTT (90ms)
net.ipv4.tcp_rmem = 4096 131072 224395264
net.ipv4.tcp_wmem = 4096 131072 224395264
# Cap UNSENT bytes per TCP socket; bytes in flight are not limited. With the
# tcp_wmem max above, a slow reader otherwise queues tens of MB of stale data
# in our send buffers
net.ipv4.tcp_notsent_lowat = 131072
net.netfilter.nf_conntrack_max = 1048576
